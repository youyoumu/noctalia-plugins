id = "youyoumu/run"
name = "Run"
version = "1.0.0"
plugin_api = 22
author = "youyoumu"
license = "MIT"
dependencies = []
tags = ["launcher", "utility"]
icon = "run"
description = "Launcher for running custom scripts. Type /run to activate."

[[setting]]
key = "scripts_path"
type = "file"
label_key = "settings.scripts_path.label"
description_key = "settings.scripts_path.description"
extensions = [".json"]
default = "scripts.json"

[[launcher_provider]]
id = "scripts"
entry = "launcher.entry.luau"
prefix = "run"
glyph = "run"
include_in_global_search = false
